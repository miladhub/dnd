quarkus.langchain4j.openai.api-key=$OPENAI_API_KEY
quarkus.log.category."io.netty".level=WARN
# Browser SSE disconnects can race with an already queued Netty write. This
# produces a harmless closed-channel/reference-count warning during teardown.
quarkus.log.category."io.netty.channel.AbstractChannelHandlerContext".level=OFF
quarkus.log.category."org.jboss.resteasy.reactive.server.handlers".level=WARN
# A browser closing/reconnecting an SSE stream is reported by RESTEasy as a
# ClosedChannelException while the queued event is being written. The stream
# cleans up its subscriber in RestServer; suppress only this noisy handler log.
quarkus.log.category."org.jboss.resteasy.reactive.server.handlers.PublisherResponseHandler".level=OFF
